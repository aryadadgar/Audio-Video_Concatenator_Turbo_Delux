name: Native CMake Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Configure native build
        run: |
          cd "video_audio_merger-ANDROID VERION/native"
          mkdir -p build
          cd build
          cmake ..

      - name: Build native executable
        run: |
          cd "video_audio_merger-ANDROID VERION/native/build"
          cmake --build . -- -j$(nproc)

      - name: Upload native executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: native_concat
          path: 'video_audio_merger-ANDROID VERION/native/build/native_concat'
